# waywall 내장 기본값.
#
# 이 파일이 모든 설정 키의 정본입니다. 코드에는 기본값이 없으며, 여기서 빠진 키는
# 시작 시 오류가 됩니다. 사용자 config.toml은 이 위에 덮어씁니다.
# `waywall config defaults`로 이 내용을 볼 수 있습니다.

volume     = 50
mute       = false
pause_when = "fullscreen"    # never | fullscreen | maximized | any-window

[log]
level = "info"               # RUST_LOG가 없을 때의 tracing 필터

[surface]
layer     = "background"     # background | bottom | top | overlay
namespace = "waywall"        # 컴포지터 규칙에서 식별용 layer-shell 네임스페이스

[render]
gpu          = "low-power"   # low-power | high-performance
max_fps      = 0             # shader/scene fps 상한. 0 = 상한 없음(모니터마다 자기 주사율)
render_scale = 1.0           # 배경의 render_scale 옵션과 곱해짐
present_mode = "mailbox"     # mailbox | fifo | immediate (지원 안 되면 fifo)
frame_latency = 2
hdr_format   = "rgba16float" # rgba16float | rg11b10ufloat | rgba32float

[visibility]
frame_timeout_ms = 1500
slow_frame_count = 3
foreign_toplevel = true
niri             = false

[web_helper]
restart_limit    = 3         # 헬퍼가 restart_window_s 안에 이만큼 비정상 종료하면 다시 띄우지 않음
restart_window_s = 60

[cursor]
shape = "default"            # wp_cursor_shape_v1 이름 또는 hidden
theme = ""                   # 빈 값 = XCURSOR_THEME
size  = 24

[appearance]
empty   = "#000000"          # 배경이 없는 출력: 색 또는 배경 경로
error   = "previous"         # previous | 색 | 배경 경로
loading = "previous"

[assets]
dir = "${XDG_CONFIG_HOME:-~/.config}/waywall/assets"

[detect]
image        = ["png", "jpg", "jpeg", "webp", "bmp", "gif"]
video        = ["mp4", "webm", "mkv", "mov"]
shader       = ["glsl", "frag", "wgsl"]
web          = ["html", "htm"]
url_schemes  = ["http://", "https://"]
project_file = "project.toml"

[types.image]
fit              = "cover"   # cover | contain | fill
background       = "#000000"
interactive      = false
downscale        = true
downscale_filter = "lanczos3" # nearest | triangle | catmull-rom | gaussian | lanczos3

[types.video]
fit         = "cover"
background  = "#000000"
interactive = false
loop        = true
audio       = true
speed       = 1.0
hwdec       = true

[types.shader]
fps          = 0             # 0 = frame 콜백마다 (render.max_fps가 상한)
render_scale = 1.0
interactive  = true
background   = "#000000"     # 첫 프레임 전에 보이는 색

[types.shader.channel]       # [inputs] 채널에서 생략한 값
filter = "linear"            # linear | nearest
wrap   = "repeat"            # repeat | clamp | mirror

[types.scene]
fps          = 0
render_scale = 1.0
interactive  = true
fit          = "cover"
clear        = "#000000"
pointer_smoothing = 0.15     # 패럴랙스가 포인터를 따라가는 시간 상수(초). 0 = 즉시
settle_px         = 0.25     # 목표와의 차이가 이보다 작으면(출력 px) 멈추고 잠듦

[types.scene.post]
exposure = 1.0
tonemap  = "aces"            # assets/shaders/tonemap/<이름>.wgsl
bloom    = { threshold = 1.0, intensity = 0.5, radius = 4 }
vignette = 0.0

[types.scene.layer]
blend    = "normal"          # normal | add | multiply | screen
opacity  = 1.0
parallax = 0.0
visible  = true

[types.scene.image]
scale    = 1.0               # 숫자 또는 [x, y]
rotation = 0.0               # 도, 시계 방향
lit      = false             # true면 [[light]]의 영향을 받음

[types.scene.particles]
max        = 1000            # GPU 버퍼 크기. 모자라면 오래된 파티클부터 바뀜
sprite     = "sprites/soft-circle.wgsl"   # 무늬(texture/sprite)를 정하지 않은 레이어의 기본값 (assets 기준)
blend      = "add"
emitter    = { shape = "point", rate = 10.0, burst = 0 }   # point | box | circle
lifetime   = [1.0, 2.0]      # 초, 숫자 또는 [최소, 최대]
velocity   = { min = [0.0, 0.0], max = [0.0, 0.0] }        # px/s
gravity    = [0.0, 0.0]      # px/s², y가 아래로 +
drag       = 0.0             # 1/s
turbulence = { strength = 0.0, scale = 0.005, speed = 0.5 }  # px/s, 1/px, 흐름 변화 속도
size       = 4.0             # 지름 px, 숫자 또는 { start, end }
color      = "#ffffff"       # 값 하나 또는 { start, end }
emissive   = 1.0
pointer    = { mode = "none", radius = 200.0, strength = 300.0 }  # none | attract | repel, px, px/s²
max_step   = 0.1             # 한 프레임 시뮬레이션의 최대 dt(초)

[types.scene.shader]
channel = { filter = "linear", wrap = "clamp" }   # inputs 채널에서 생략한 값
render_scale = 1.0           # 이 레이어를 그리는 해상도 배율 (rect의 렌더 크기 × 이 값)

[types.scene.light.ambient]  # [[light]]에서 생략한 필드
color     = "#ffffff"
intensity = 1.0

[types.scene.light.point]
color     = "#ffffff"
intensity = 1.0
radius    = 300.0            # 설계 px, 이 거리에서 0
height    = 100.0            # 화면 위로 떠 있는 높이 (설계 px)
flicker   = 0.0              # 0–1 밝기 흔들림
flicker_speed = 8.0          # 흔들림이 바뀌는 빈도 (초당)

[types.scene.light.directional]
color     = "#ffffff"
intensity = 1.0
direction = [0.0, 0.0, -1.0] # x 오른쪽, y 아래, z 보는 사람 쪽

[types.scene.effects.sway]   # sway 효과에서 생략한 필드. 새 효과 파일은 [types.scene.effects.<이름>]으로 기본값
strength  = 4.0              # 설계 px (마스크 흰색일 때)
speed     = 0.6              # 흔들림이 바뀌는 빠르기
scale     = 0.01             # 노이즈 주파수 (1/px), 작을수록 넓게 함께 움직임
direction = [1.0, 0.0]

[types.scene.follow]         # follow에서 생략한 필드
range     = 600.0            # 설계 px, 이 거리부터 최대 이동
smoothing = 0.12             # 초, 0 = 즉시
on_leave  = "center"         # center | stay

[types.web]
background  = "#000000"
interactive = true
audio       = true
