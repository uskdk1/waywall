[package]
name = "waywall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14.5", features = ["signals"] }
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "rayon"] }
include_dir = "0.7.4"
memmap2 = "0.9.12"
rustix = { version = "1.1.6", features = ["shm", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-cursor = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
waywall-proto = { version = "0.1.0", path = "../waywall-proto" }
