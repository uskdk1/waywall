[package]
name = "waywall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
calloop = { version = "0.14.5", features = ["signals"] }
calloop-wayland-source = "0.4.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
gstreamer = { version = "0.25.4", features = ["v1_24"] }
gstreamer-allocators = { version = "0.25.4", features = ["v1_24"] }
gstreamer-app = { version = "0.25.2", features = ["v1_24"] }
gstreamer-video = { version = "0.25.4", features = ["v1_24"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "rayon"] }
include_dir = "0.7.4"
memmap2 = "0.9.12"
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in"] }
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rustix = { version = "1.1.6", features = ["shm", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-cursor = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
waywall-proto = { version = "0.1.0", path = "../waywall-proto" }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "glsl", "wgsl", "naga-ir", "std"] }
