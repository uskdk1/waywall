[package]
name = "waywall-web"
description = "waywall 웹 배경 헬퍼 (GTK4 + WebKitGTK)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
serde_json = "1"
waywall-proto = { path = "../waywall-proto" }
webkit6 = { version = "0.6", features = ["v2_50"] }
