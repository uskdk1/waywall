<!doctype html>
<!-- M7 예제: 마우스에 반응하는 웹 배경 + window.waywall (docs/wallpaper-format.md#웹-배경). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070912; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 24px; bottom: 20px; font: 14px sans-serif; color: #8ea0c0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<script>
  const ww = window.waywall ?? { properties: { hue: 200 }, output: "browser", paused: false };
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const info = document.getElementById("info");
  let dots = [];
  let running = !ww.paused;

  function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
  }
  addEventListener("resize", resize);
  resize();

  function showInfo() {
    info.textContent = `${ww.output} · hue ${Math.round(ww.properties.hue)} · ${running ? "playing" : "paused"}`;
  }
  showInfo();

  addEventListener("mousemove", (e) => {
    for (let i = 0; i < 3; i++) {
      dots.push({ x: e.clientX * devicePixelRatio, y: e.clientY * devicePixelRatio,
                  vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 1 });
    }
  });
  addEventListener("click", (e) => {
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 8;
      dots.push({ x: e.clientX * devicePixelRatio, y: e.clientY * devicePixelRatio,
                  vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1 });
    }
  });

  // waywall 이벤트: 멈추면 루프도 멈춘다 (requestAnimationFrame은 가려지면 저절로 멈추지만, 직접 멈추면 확실하다).
  addEventListener("waywall-pause", () => { running = false; showInfo(); });
  addEventListener("waywall-resume", () => { running = true; showInfo(); requestAnimationFrame(frame); });
  addEventListener("waywall-properties", () => showInfo());

  function frame() {
    if (!running) return;
    ctx.fillStyle = "rgba(7, 9, 18, 0.18)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy; d.vx *= 0.97; d.vy *= 0.97; d.life -= 0.012;
      ctx.fillStyle = `hsla(${ww.properties.hue + (1 - d.life) * 80}, 90%, 65%, ${d.life})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, 3 * devicePixelRatio * d.life + 1, 0, Math.PI * 2);
      ctx.fill();
    }
    dots = dots.filter((d) => d.life > 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
